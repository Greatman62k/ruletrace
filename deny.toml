# cargo-deny configuration (task 2.2, design §7.4, Req 21.7).
# The network and AI crate bans are added in task 10.2.
# Note: cargo-deny spells the licence section `licenses`.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9

# Workspace crates are `publish = false` with license "UNLICENSED".
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Network and AI crate bans: task 10.2.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
