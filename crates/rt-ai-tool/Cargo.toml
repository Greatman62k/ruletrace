[package]
name = "rt-ai-tool"
description = "ruletrace-ai: configuration, consent, credential, redaction and Transmission_Log (class aux)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "rt_ai_tool"
path = "src/lib.rs"

[[bin]]
name = "ruletrace-ai"
path = "src/main.rs"

[dependencies]
rt-ai-adapter = { path = "../rt-ai-adapter" }
rt-ai-mock = { path = "../rt-ai-mock" }
rt-foundation = { path = "../rt-foundation" }
rt-hash = { path = "../rt-hash" }
rt-ir = { path = "../rt-ir" }
rt-json = { path = "../rt-json" }
rt-proposals = { path = "../rt-proposals" }
rt-srcmodel = { path = "../rt-srcmodel" }
rt-validate = { path = "../rt-validate" }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
rt-ledger = { path = "../rt-ledger" }
