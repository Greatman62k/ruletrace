# RuleTrace CI skeleton (task 2.2, design §7.4, Req 21.3, 21.4, 21.7, 21.10, 21.12).
# Runner labels are pinned per UD-15 (tools/decisions/UD-15.md). No `*-latest` label is used.
# Jobs marked STUB are filled in by later tasks; they exist now so the required-check set is stable.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      propose:
        description: "live-openai only: also run one live propose over the synthetic stand-in document (needs the secret and the model variable)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
      - name: cargo fmt --check
        run: |
          mkdir -p ci-output
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee ci-output/fmt.log
      - name: Keep failed-check output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fmt-${{ matrix.os }}
          path: ci-output/
          if-no-files-found: warn

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
      - name: cargo clippy
        run: |
          mkdir -p ci-output
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee ci-output/clippy.log
      - name: Keep failed-check output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: clippy-${{ matrix.os }}
          path: ci-output/
          if-no-files-found: warn

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      # The live-provider job is separate (Req 21.14); no credential is present here.
      # The hand acceptance test runs `cargo metadata --offline`, which needs the
      # packages of every platform; `cargo test` fetches only the host's.
      - name: Fetch every locked dependency
        run: cargo fetch --locked
      - name: cargo test
        run: |
          mkdir -p ci-output
          set -o pipefail
          cargo test --workspace --all-features --no-fail-fast 2>&1 | tee ci-output/test.log
      - name: Keep failed-check output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-${{ matrix.os }}
          path: ci-output/
          if-no-files-found: warn

  golden:
    # STUB: fixture byte comparison. The golden tests live in rt-tests-core and are added by later
    # tasks. A test-name filter that matches nothing passes, so this job is green until they exist.
    # When filled in, a failure must name the golden file and the platform (Req 21.12).
    name: golden (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - name: Golden byte comparison (.gitattributes `* -text` keeps bytes unchanged)
        env:
          RULETRACE_CI_PLATFORM: ${{ matrix.os }}
        run: |
          mkdir -p ci-output
          set -o pipefail
          cargo test -p rt-tests-core --all-features golden 2>&1 | tee ci-output/golden.log
      - name: Keep failed-check output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: golden-${{ matrix.os }}
          path: ci-output/
          if-no-files-found: warn

  toolchain:
    name: toolchain (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - name: rustc version equals rust-toolchain.toml
        run: |
          mkdir -p ci-output
          expected=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          echo "expected=$expected actual=$actual" | tee ci-output/toolchain.log
          test -n "$expected" && test "$expected" = "$actual"
      - name: Keep failed-check output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: toolchain-${{ matrix.os }}
          path: ci-output/
          if-no-files-found: warn

  graph:
    # Design §7.4. check-app-layers, check-executables, gen-claims and scan-claims are added by the
    # tasks that implement them.
    name: graph (linux)
    runs-on: ubuntu-24.04
    steps:
      # Full history and tags: check-catalogue reads `git tag --list` (Req 7.12).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install pinned toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - name: Build rt-xtask
        run: cargo build -p rt-xtask
      - name: rt-xtask checks
        run: |
          mkdir -p ci-output
          set -o pipefail
          cargo run -q -p rt-xtask -- check-graph check-tree scan-sources scan-api check-decisions check-catalogue check-justification 2>&1 | tee ci-output/graph.log
      - name: Keep failed-check output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: graph-linux
          path: ci-output/
          if-no-files-found: warn

  deny:
    # STUB: runs cargo-deny against deny.toml. Network and AI crate bans are added in task 10.2.
    name: deny (linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: |
          mkdir -p ci-output
          set -o pipefail
          cargo deny check 2>&1 | tee ci-output/deny.log
      - name: Keep failed-check output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: deny-linux
          path: ci-output/
          if-no-files-found: warn

  core-only:
    # Design §7.4, Req 20.16: the core with every auxiliary crate excluded. `--exclude` of a package
    # that is not yet in the workspace only warns, so the list is stable while the AI crates are added.
    name: core-only (linux)
    runs-on: ubuntu-24.04
    env:
      AUX_EXCLUDE: >-
        --exclude rt-ai-adapter --exclude rt-ai-mock --exclude rt-ai-responses
        --exclude rt-ai-tool --exclude rt-tests-ai
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      # The excluded crates are not built, but the hand acceptance test runs
      # `cargo metadata --offline` over the whole workspace.
      - name: Fetch every locked dependency
        run: cargo fetch --locked
      - name: Build and test the core with auxiliary crates excluded
        run: |
          mkdir -p ci-output
          set -o pipefail
          {
            cargo build --workspace $AUX_EXCLUDE --bins --target-dir target/core-only
            cargo test --workspace --all-features --no-fail-fast $AUX_EXCLUDE --target-dir target/core-only \
              -- --skip ai_profile_
          } 2>&1 | tee ci-output/core-only.log
      - name: Core-only build holds no ruletrace-ai
        # The Property 41 cells with the tool present use an inert file when the real executable is
        # absent. This step makes sure that the core-only build really has no real one.
        run: |
          test -x target/core-only/debug/ruletrace
          for name in ruletrace-ai ruletrace-ai.exe; do
            if [ -e "target/core-only/debug/$name" ]; then
              echo "target/core-only/debug/$name exists: the core-only build holds ruletrace-ai" >&2
              exit 1
            fi
          done
          if ls target/core-only/debug/deps 2>/dev/null | grep -Eq '^(ruletrace_ai|rt_ai_tool)'; then
            echo "an AI tool artifact is in the core-only build" >&2
            exit 1
          fi
      - name: Resolved tree has no network or AI crate (check-tree)
        run: |
          set -o pipefail
          cargo run -q -p rt-xtask -- check-tree 2>&1 | tee ci-output/core-only-tree.log
          cargo tree -p rt-cli -e normal,build,dev --all-features --prefix none 2>/dev/null \
            | tee ci-output/rt-cli-tree.txt
          if grep -Eiq '^(ureq|reqwest|hyper|tokio|openssl|native-tls|rustls|curl|isahc|attohttpc|rt-ai-)' ci-output/rt-cli-tree.txt; then
            echo "network or AI crate in the ruletrace tree" >&2
            exit 1
          fi
      - name: Output bytes equal the full build (hand profile against goldens)
        # Both builds run the same hand-profile tests and the Property 41 matrix, which compare
        # every output byte with the golden files, so equal goldens mean equal bytes (Req 20.16).
        run: |
          set -o pipefail
          cargo build --workspace --bins --target-dir target/full
          for dir in core-only full; do
            RT_BIN_DIR="$PWD/target/$dir/debug" cargo test -p rt-demo --all-features \
              --test stand_in_hand --test acceptance_hand --test ai_independence \
              --test origin_independence --target-dir "target/$dir" 2>&1 \
              | tee -a ci-output/core-only-hand.log
          done
      - name: Keep failed-check output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: core-only-linux
          path: ci-output/
          if-no-files-found: warn

  demo-offline:
    # Design §7.4, Req 33.15, 33.16, 20.26: the `hand` profile with no credential. On Linux the run
    # happens in an empty network namespace. macOS and Windows have no portable equivalent; the
    # harness gives every process an empty environment and the job sets no credential.
    name: demo-offline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - name: Fetch dependencies and build the executables
        run: |
          mkdir -p ci-output
          set -o pipefail
          cargo fetch --locked
          cargo build --workspace --bins --offline 2>&1 | tee ci-output/demo-build.log
          cargo test -p rt-demo --all-features --offline --no-run 2>&1 | tee -a ci-output/demo-build.log
      - name: Run the hand and ai profiles with no network and no credential
        env:
          RULETRACE_CI_PLATFORM: ${{ matrix.os }}
        run: |
          set -o pipefail
          export RT_BIN_DIR="$PWD/target/debug"
          unset OPENAI_API_KEY RULETRACE_AI_KEY
          cmd=(cargo test -p rt-demo --all-features --offline --test stand_in_hand --test acceptance_hand --test acceptance)
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" "HOME=$HOME" "RT_BIN_DIR=$RT_BIN_DIR" "${cmd[@]}" 2>&1 | tee ci-output/demo-offline.log
          else
            "${cmd[@]}" 2>&1 | tee ci-output/demo-offline.log
          fi
      - name: Keep failed-check output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: demo-offline-${{ matrix.os }}
          path: ci-output/
          if-no-files-found: warn

  # Design §7.4, Req 21.14, UD-15 section 6. Not required: it is not in the `needs` of ci-gate.
  # Live steps run only when the repository secret and the model variable are both set. Fork pull
  # requests have no secrets, so they skip cleanly. The secret is referenced only in this env block.
  live-openai:
    name: live-openai (linux, optional)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RULETRACE_OPENAI_MODEL: ${{ vars.RULETRACE_OPENAI_MODEL }}
    steps:
      - name: Gate (is the live job configured?)
        id: gate
        env:
          RULETRACE_OPENAI_API_KEY: ${{ secrets.RULETRACE_OPENAI_API_KEY }}
        run: |
          configured=false
          if [ -z "${RULETRACE_OPENAI_API_KEY:-}" ]; then
            echo "live-openai skipped: the repository secret RULETRACE_OPENAI_API_KEY is not set."
          elif [ -z "${RULETRACE_OPENAI_MODEL:-}" ]; then
            echo "live-openai skipped: the secret is set but the repository variable RULETRACE_OPENAI_MODEL is empty or absent."
          else
            configured=true
            echo "live-openai configured: the secret and the model variable are set."
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.gate.outputs.configured == 'true'
      - name: Install pinned toolchain
        if: steps.gate.outputs.configured == 'true'
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - name: Build the executables
        if: steps.gate.outputs.configured == 'true'
        run: cargo build --locked --bins -p rt-ai-tool -p rt-cli
      - name: Write the configuration (mode 600, credential by name only)
        if: steps.gate.outputs.configured == 'true'
        run: |
          # Bracket ranges follow the locale collation, so pin the ASCII order.
          export LC_ALL=C
          # The model text comes from a variable. Refuse anything outside a conservative charset.
          # A bash regex matches the whole value, so an embedded line feed is refused too.
          pattern='^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$'
          if ! [[ "$RULETRACE_OPENAI_MODEL" =~ $pattern ]]; then
            echo "RULETRACE_OPENAI_MODEL is not a plain model identifier (letters, digits, . _ : -, at most 100). Nothing was written." >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/live-openai"
          mkdir -p "$dir"
          for use in models propose; do
            allow=false
            if [ "$use" = propose ]; then allow=true; fi
            umask 077
            cat > "$dir/$use.toml" <<EOF
          schema_version = 2
          enabled = true
          allow_document_text = $allow
          ai_identities = ["openai", "$RULETRACE_OPENAI_MODEL"]
          transmission_log = "$dir/$use-transmission.log.jsonl"
          max_clauses_per_request = 5

          [provider]
          id = "openai"
          protocol = "openai-responses"
          model = "$RULETRACE_OPENAI_MODEL"
          endpoint = "https://api.openai.com"
          credential_env_var = "RULETRACE_OPENAI_API_KEY"

          [limits]
          total_deadline_secs = 60
          attempt_timeout_secs = 20
          max_retries = 0
          max_response_bytes = 1048576
          EOF
            chmod 600 "$dir/$use.toml"
          done
      - name: Model catalogue (authenticated GET, no document text)
        if: steps.gate.outputs.configured == 'true'
        env:
          RULETRACE_OPENAI_API_KEY: ${{ secrets.RULETRACE_OPENAI_API_KEY }}
        run: target/debug/ruletrace-ai models --config "$RUNNER_TEMP/live-openai/models.toml"
      - name: Live propose over the synthetic stand-in document (manual run only)
        if: steps.gate.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.propose == true
        env:
          RULETRACE_OPENAI_API_KEY: ${{ secrets.RULETRACE_OPENAI_API_KEY }}
        run: |
          dir="$RUNNER_TEMP/live-openai"
          bin="$PWD/target/debug"
          cd demo/stand-in-ai
          "$bin/ruletrace" ingest --document documents/stand-in-rules.md --document-id stand-in-rules.md \
            --out "$dir/source-model.json" --candidates "$dir/candidates.json"
          set +e
          "$bin/ruletrace-ai" propose --config "$dir/propose.toml" --rulebook rulebook/seed.json \
            --source-model "$dir/source-model.json" --candidates "$dir/candidates.json" \
            --store "$dir/store" --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --consent stand-in-rules.md
          code=$?
          set -e
          echo "ruletrace-ai propose exit code: $code"
          case "$code" in
            0|2|3|5|6) echo "informational: no assertion is made on the model output." ;;
            *) echo "internal error or unexpected exit code $code" >&2; exit 1 ;;
          esac

  # Single required check for branch protection. It fails if any job, on any platform, is
  # failed, skipped or cancelled, and if a platform is missing from a matrix (design §7.4, Req 21.4).
  gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [fmt, clippy, test, golden, toolchain, graph, deny, core-only, demo-offline]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Every job succeeded (no failure, skip or cancel)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | grep '"result"' | tee /dev/stderr | grep -v '"result": "success"' && {
            echo "A job did not succeed (failed, skipped or cancelled)." >&2
            exit 1
          }
          exit 0
      - name: Every platform is present in every three-platform job
        run: |
          for label in ubuntu-24.04 macos-15 windows-2022; do
            n=$(grep -c "os: \[ubuntu-24.04, macos-15, windows-2022\]" .github/workflows/ci.yml)
            test "$n" -eq 6 || { echo "expected 6 three-platform matrices, found $n" >&2; exit 1; }
            grep -q "$label" .github/workflows/ci.yml || { echo "missing platform $label" >&2; exit 1; }
          done
